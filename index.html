<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Planner</title>
    <link rel="stylesheet" href="./src/index.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <button id="menuBtn">☰</button>
            <div>Название проекта</div>
            <div class="actions">
                <button id="undoBtn">←</button>
                <button id="redoBtn">→</button>
            </div>
            <button id="moreBtn">⋯</button>
            <button id="loginBtn">Войти</button>
            <button id="saveBtn" class="save">Сохранить</button>
        </div>

        <!-- Main content -->
        <div class="main">
            <!-- Sidebar -->
            <div class="sidebar">
                <h3>
                    Меню
                    <span style="font-size: 14px; color: #5f637a;">˅</span>
                </h3>
                <div class="category">
                    <h4>Мебель</h4>
                    <div class="grid" id="sidebar-furniture-grid"></div>
                </div>
                <div class="category">
                    <h4>Стены</h4>
                    <div class="grid" id="sidebar-wall-grid"></div>
                </div>
            </div>

            <!-- Canvas -->
            <div class="canvas" id="canvas"></div>

            <!-- Inspector -->
            <div class="inspector">
                <div class="inspector-header">
                    <h3 id="inspector-title">Название объекта</h3>
                    <div class="preview-box" id="preview-box"></div>
                </div>

                <div class="inspect-grid">
                    <div class="row">
                        <div class="field">
                            <label>X:</label>
                            <input type="number" id="field-x">
                        </div>
                        <div class="field">
                            <label>Y:</label>
                            <input type="number" id="field-y">
                        </div>
                        <div class="field">
                            <label>Z:</label>
                            <input type="number" id="field-z">
                        </div>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label>Ширина:</label>
                            <input type="number" id="field-width">
                        </div>
                        <div class="field">
                            <label>Длина:</label>
                            <input type="number" id="field-length">
                        </div>
                        <div class="field">
                            <label>Высота:</label>
                            <input type="number" id="field-height">
                        </div>
                    </div>
                    <div class="row">
                        <div class="field">
                            <label>Угол:</label>
                            <input type="number" id="field-angle" step="1" min="0" max="359">
                        </div>
                    </div>
                    <div class="row">
                        <div class="field" style="grid-column: span 3; display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="field-bearing">
                            <label for="field-bearing">Несущая стена</label>
                        </div>
                    </div>
                </div>

                <div class="buttons">
                    <button id="btn-visibility">👁</button>
                    <button id="btn-lock">🔒</button>
                    <button id="btn-delete">🗑</button>
                </div>
            </div>
        </div>

        <!-- Zoom control -->
        <div class="zoom">
            <button id="zoomInBtn">+</button>
            <span id="zoomLabel">100%</span>
            <button id="zoomOutBtn">-</button>
        </div>
    </div>

    <script src="./src/app.js"></script>
</body>
</html>
