<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Planner</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <button id="menuBtn">☰</button>
            <input type="text" id="projectName" placeholder="Project name" class="project-name">
            <div class="actions">
                <button id="undoBtn" title="Undo">←</button>
                <button id="redoBtn" title="Redo">→</button>
            </div>
            <button id="moreBtn" title="More">⋯</button>
            <button id="loginBtn">Login</button>
            <button id="saveBtn" class="save">Save</button>
        </div>

        <!-- Main content -->
        <div class="main">
            <!-- Sidebar -->
            <div class="sidebar">
                <h3>
                    Menu
                    <span style="font-size: 14px; color: #5f637a;">˅</span>
                </h3>
                <div class="category">
                    <h4>Furniture</h4>
                    <div class="grid" id="sidebar-furniture-grid"></div>
                </div>
                <div class="category">
                    <h4>Walls</h4>
                    <div class="grid" id="sidebar-wall-grid"></div>
                </div>
                <div class="category">
                    <h4>Custom Objects</h4>
                    <div class="grid" id="sidebar-custom-grid"></div>
                    <button id="uploadCustomBtn" class="upload-btn">+ Upload Custom Object</button>
                </div>
            </div>

            <!-- Canvas -->
            <div class="canvas" id="canvas"></div>

            <!-- Inspector -->
            <div class="inspector">
                <div class="inspector-header">
                    <h3 id="inspector-title">Select an object</h3>
                    <div class="preview-box" id="preview-box"></div>
                </div>

                <div class="inspect-grid">
                    <div class="row">
                        <div class="field">
                            <label>X:</label>
                            <input type="number" id="field-x">
                        </div>
                        <div class="field">
                            <label>Y:</label>
                            <input type="number" id="field-y">
                        </div>
                        <div class="field">
                            <label>Z:</label>
                            <input type="number" id="field-z">
                        </div>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label>Width:</label>
                            <input type="number" id="field-width">
                        </div>
                        <div class="field">
                            <label>Length:</label>
                            <input type="number" id="field-length">
                        </div>
                        <div class="field">
                            <label>Height:</label>
                            <input type="number" id="field-height">
                        </div>
                    </div>
                    <div class="row">
                        <div class="field">
                            <label>Angle:</label>
                            <input type="number" id="field-angle" step="1" min="0" max="359">
                        </div>
                    </div>

                    <div class="row">
                        <div class="field" style="grid-column: span 3; display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="field-bearing">
                            <label for="field-bearing">Bearing Wall</label>
                        </div>
                    </div>

                    <div class="row">
                        <div class="field" style="grid-column: span 3; display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="field-visible" checked>
                            <label for="field-visible">Visible</label>
                        </div>
                    </div>

                    <div class="row">
                        <div class="field" style="grid-column: span 3; display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="field-locked">
                            <label for="field-locked">Locked</label>
                        </div>
                    </div>

                    <div class="row">
                        <label>Bind to Wall:</label>
                        <select id="field-bind-wall">
                            <option value="">None</option>
                        </select>
                    </div>
                </div>

                <div class="buttons">
                    <button id="btn-visibility">👁</button>
                    <button id="btn-lock">🔒</button>
                    <button id="btn-delete">🗑</button>
                </div>
            </div>
        </div>

        <!-- Zoom control -->
        <div class="zoom">
            <button id="zoomInBtn">+</button>
            <span id="zoomLabel">100%</span>
            <button id="zoomOutBtn">−</button>
        </div>
    </div>

    <!-- Modal for login -->
    <div id="loginModal" class="modal hidden">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Login / Register</h2>
            <form id="authForm">
                <input type="text" id="authUsername" placeholder="Username" required>
                <input type="password" id="authPassword" placeholder="Password" required>
                <input type="email" id="authEmail" placeholder="Email" style="display:none;">
                <button type="submit" id="authSubmitBtn">Login</button>
                <button type="button" id="authToggleBtn">Register instead</button>
            </form>
            <div id="authMessage"></div>
        </div>
    </div>

    <!-- Modal for upload custom object -->
    <div id="uploadModal" class="modal hidden">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Upload Custom Object</h2>
            <form id="uploadForm">
                <input type="text" id="uploadName" placeholder="Object name" required>
                <input type="text" id="uploadDesc" placeholder="Description">
                <input type="number" id="uploadWidth" placeholder="Width" required>
                <input type="number" id="uploadHeight" placeholder="Height" required>
                <input type="number" id="uploadLength" placeholder="Length" required>
                <input type="color" id="uploadColor" value="#888888">
                <input type="file" id="uploadFile" accept=".svg,.obj,.png,.jpg">
                <button type="submit">Upload</button>
            </form>
            <div id="uploadMessage"></div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
