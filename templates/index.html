<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Planner</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <button id="menuBtn" title="Project list">☰</button>
            <input type="text" id="projectName" placeholder="Project name" class="project-name">
            <div class="actions">
                <button id="newWorkspaceBtn" title="Новое рабочее пространство">📄 Новое пространство</button>
                <button id="undoBtn" title="Previous project">←</button>
                <button id="redoBtn" title="Next project">→</button>
                <button id="measureToolBtn" title="Рулетка">📏 Рулетка</button>
                <button id="measureClearBtn" title="Удалить линии рулетки">🧹 Очистить</button>
                <button id="createRoomBtn" title="Создать комнату">🏠 Создать комнату</button>
            </div>
            <button id="moreBtn" title="More">⋯</button>
            <div class="header-auth" id="headerAuth">
                <button type="button" id="loginBtn">Login</button>
                <div class="header-auth-logged hidden" id="headerAuthLogged">
                    <button type="button" class="header-auth-name" id="userNameMenuBtn" aria-expanded="false" aria-haspopup="true"></button>
                    <div class="header-auth-dropdown hidden" id="userMenuDropdown" role="menu">
                        <button type="button" id="logoutBtn" role="menuitem">Выйти</button>
                    </div>
                </div>
            </div>
            <button id="saveBtn" class="save">Save</button>
        </div>

        <!-- Main content -->
        <div class="main">
            <!-- Sidebar -->
            <div class="sidebar">
                <h3>
                    Меню
                    <span style="font-size: 14px; color: #5f637a;">˅</span>
                </h3>
                <div class="category">
                    <h4>Типы мебели</h4>
                    <div class="grid" id="sidebar-furniture-grid"></div>
                </div>
                <div class="category">
                    <h4>Стены</h4>
                    <div class="grid" id="sidebar-wall-grid"></div>
                    <div style="font-size: 12px; color: #5f637a; margin-top: 8px; line-height: 1.2;">
                        Двери/окна находятся тут же. Выберите и кликните по стене для установки.
                    </div>
                </div>
                <div class="category">
                    <h4>Свои объекты</h4>
                    <div class="grid" id="sidebar-custom-grid"></div>
                    <button id="uploadCustomBtn" class="upload-btn">+ Загрузить свой объект</button>
                </div>
            </div>

            <!-- Canvas -->
            <div class="canvas" id="canvas"></div>

            <!-- Inspector -->
            <div class="inspector">
                <div class="inspector-header">
                    <h3 id="inspector-title">Выбрать объект</h3>
                </div>

                <div class="inspect-grid">
                    <div class="row">
                        <div class="field">
                            <label>X (см):</label>
                            <input type="number" id="field-x">
                        </div>
                        <div class="field">
                            <label>Y (см):</label>
                            <input type="number" id="field-y">
                        </div>
                        <div class="field">
                            <label for="field-z" title="Больше Z — объект выше и перекрывает мебель с меньшим Z (стены, двери и окна без изменений)">Z (слой):</label>
                            <input type="number" id="field-z" step="1">
                        </div>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label>Ширина (см):</label>
                            <input type="number" id="field-width">
                        </div>
                        <div class="field">
                            <label>Высота (см):</label>
                            <input type="number" id="field-height">
                        </div>
                        <div class="field">
                            <label>Угол (градусы):</label>
                            <input type="number" id="field-angle" step="1" min="0" max="359">
                        </div>
                    </div>

                    <div class="row">
                        <div class="field">
                            <label>Комментарии:</label>
                            <textarea id="field-comment" rows="3" style="width: 540%; resize: vertical;"></textarea>
                        </div>
                    </div>
                </div>

                <div class="inspector-actions" role="toolbar" aria-label="Действия с объектом">
                    <button type="button" id="btn-visibility" class="inspector-action" title="Показать или скрыть объект на плане">
                        <span class="inspector-action-icon" aria-hidden="true">👁</span>
                        <span class="inspector-action-caption">Видимость</span>
                    </button>
                    <button type="button" id="btn-lock" class="inspector-action" title="Заблокировать перемещение и удаление">
                        <span class="inspector-action-icon" aria-hidden="true">🔒</span>
                        <span class="inspector-action-caption">Блокировка</span>
                    </button>
                    <button type="button" id="btn-ignore-overlap" class="inspector-action" title="С другой мебелью пересечение не считается ошибкой">
                        <span class="inspector-action-icon" aria-hidden="true">⊘</span>
                        <span class="inspector-action-caption">Без коллизий</span>
                    </button>
                    <button type="button" id="btn-delete" class="inspector-action inspector-action--danger" title="Удалить объект">
                        <span class="inspector-action-icon" aria-hidden="true">🗑</span>
                        <span class="inspector-action-caption">Удалить</span>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal for login -->
    <div id="loginModal" class="modal hidden">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Login / Register</h2>
            <form id="authForm">
                <input type="text" id="authUsername" placeholder="Username" required>
                <input type="password" id="authPassword" placeholder="Password" required>
                <input type="email" id="authEmail" placeholder="Email" style="display:none;">
                <button type="submit" id="authSubmitBtn">Login</button>
                <button type="button" id="authToggleBtn">Register instead</button>
            </form>
            <div id="authMessage"></div>
        </div>
    </div>

    <!-- Modal for upload custom object -->
    <div id="uploadModal" class="modal hidden">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Upload Custom Object</h2>
            <form id="uploadForm">
                <input type="text" id="uploadName" placeholder="Object name" required>
                <input type="text" id="uploadDesc" placeholder="Description">
                <input type="number" id="uploadWidth" placeholder="Width" required>
                <input type="number" id="uploadHeight" placeholder="Height" required>
                <input type="color" id="uploadColor" value="#888888">
                <input type="file" id="uploadFile" accept=".svg,.png,.jpg,.jpeg,.webp,.gif,.obj">
                <button type="submit">Upload</button>
            </form>
            <div id="uploadMessage"></div>
        </div>
    </div>

    <script src="/static/js/objectSprites.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        // Initialize the application when DOM is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
